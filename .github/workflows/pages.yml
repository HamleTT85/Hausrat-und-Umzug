name: Publish to GitHub Pages

# Veröffentlichung läuft über den gh-pages-Branch (von GitHub automatisch
# als Pages-Quelle aktiviert). Dieser Workflow spiegelt jeden Stand von
# main nach gh-pages — die Seite aktualisiert sich damit von selbst.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push main to gh-pages
        run: git push --force origin HEAD:gh-pages
