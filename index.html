<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#12100e">
  <title>HausRat · Digitales Hausinventar & Umzugsplaner</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛋️</text></svg>">
  <script src="vendor/qrcode.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a href="#/" class="brand" aria-label="Startseite">
        <span class="brand-icon">🛋️</span>
        <span class="brand-name">Haus<em>Rat</em></span>
      </a>
      <div class="topbar-actions">
        <button id="theme-toggle" class="icon-btn" title="Design wechseln" aria-label="Design wechseln">🌗</button>
        <a href="#/scan" class="icon-btn" title="QR-Code scannen" aria-label="QR-Code scannen">📷</a>
        <a href="#/settings" class="icon-btn" title="Einstellungen" aria-label="Einstellungen">⚙️</a>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="bottombar" aria-label="Hauptnavigation">
      <a href="#/" data-nav="home"><span class="nav-ico">🏠</span><span>Start</span></a>
      <a href="#/browse" data-nav="browse"><span class="nav-ico">🗄️</span><span>Bestand</span></a>
      <a href="#/capture" class="nav-capture" data-nav="capture" title="Erfassen"><span class="nav-capture-ico">📸</span></a>
      <a href="#/search" data-nav="search"><span class="nav-ico">🔍</span><span>Suche</span></a>
      <a href="#/move" data-nav="move"><span class="nav-ico">🚚</span><span>Umzug</span></a>
    </nav>

    <div id="toast-host" aria-live="polite"></div>
    <div id="sheet-host"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
